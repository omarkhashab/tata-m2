name: kestrel-m1

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kestrel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kestrel}
      POSTGRES_DB: ${POSTGRES_DB:-kestrel}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:4
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy

  # one-shot: runs the whole M1 pipeline, loads schema "kestrel", writes Parquet to ./output/curated, exits 0
  pipeline:
    build: .
    environment:
      KESTREL_DB_URL: postgresql+psycopg2://${POSTGRES_USER:-kestrel}:${POSTGRES_PASSWORD:-kestrel}@postgres:5432/${POSTGRES_DB:-kestrel}
      KESTREL_DB_SCHEMA: kestrel
    volumes:
      - ./output:/app/output
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

volumes:
  pgdata:
